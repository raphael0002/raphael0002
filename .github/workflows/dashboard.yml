name: Refresh Profile Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    paths:
      - "scripts/generate-dashboard.mjs"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate live dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: raphael0002
        run: node scripts/generate-dashboard.mjs

      - name: Commit updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard.svg assets/dashboard-mobile.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile dashboard"
          git push
