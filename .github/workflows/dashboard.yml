name: Refresh Native Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    paths:
      - "README.md"
      - "scripts/generate-dashboard.mjs"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: write

concurrency:
  group: native-profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Update native README content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: raphael0002
        run: node scripts/generate-dashboard.mjs

      - name: Commit updated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh native profile"
          git push
